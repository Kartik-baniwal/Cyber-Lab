apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-isolation-policy
  namespace: range-session-TEMPLATE
spec:
  podSelector: {} # Applies to all pods in this session's namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow traffic from Traefik Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # 2. Allow internal communication between Workstation and Target in this session
    - from:
        - podSelector: {}
  egress:
    # 1. Allow internal communication between Workstation and Target in this session
    - to:
        - podSelector: {}
    # 2. Allow CoreDNS egress for domain resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # IMPORTANT: Cloud metadata (169.254.169.254), private VPC subnets, and K8s API server
    # are blocked by default since they are omitted from the egress allowlist.
